# Mac MPS runtime host-provider path; qualify native loopback reachability before use.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /lib64, /etc, /proc, /dev/urandom, /var/log]
  read_write: [/tmp, /dev/null, /var/lib/veoveo/embedding]
network_policies:
  registration:
    endpoints:
      - host: vv-control--hub--http.openshell.localhost
        port: 17670
        path: /oauth/register
        protocol: rest
        enforcement: enforce
        credential_binding: {provider: vv-embedding-registration}
        rules:
          - allow: {method: POST, path: /oauth/register}
    binaries:
      - path: /usr/local/bin/veoveo-mcp-embedding
  hub_metadata:
    endpoints:
      - host: vv-control--hub--http.openshell.localhost
        port: 17670
        path: /.well-known/oauth-authorization-server
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /.well-known/oauth-authorization-server}
      - host: vv-control--hub--http.openshell.localhost
        port: 17670
        path: /jwks.json
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /jwks.json}
      - host: vv-control--hub--http.openshell.localhost
        port: 17670
        path: /oauth/register/*
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /oauth/register/*}
          - allow: {method: DELETE, path: /oauth/register/*}
    binaries:
      - path: /usr/local/bin/veoveo-mcp-embedding
  hub_token_exchange:
    endpoints:
      - host: vv-control--hub--http.openshell.localhost
        port: 17670
        path: /oauth/token
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: POST, path: /oauth/token}
    binaries:
      - path: /usr/local/bin/veoveo-mcp-embedding
  artifact_calls:
    # Native ServerCalls carries the caller-bound delegated JWT; no static provider.
    # Only download metadata/grants; media bytes are fetched by the runtime.
    endpoints:
      - host: vv-control--hub--http.openshell.localhost
        port: 17670
        path: /mcp/local
        protocol: mcp
        enforcement: enforce
        mcp:
          versions: ["2026-07-28"]
          allow_all_known_mcp_methods: false
        rules:
          - allow: {method: server/discover}
          - allow: {method: ping}
          - allow: {method: tools/list}
          - allow: {method: tools/call, tool: artifact__create_download}
    binaries:
      - path: /usr/local/bin/veoveo-mcp-embedding
  embedding_runtime:
    endpoints:
      - host: host.openshell.internal
        port: 8804
        path: /capabilities
        protocol: rest
        enforcement: enforce
        credential_binding: {provider: vv-embedding-inference}
        rules:
          - allow: {method: GET, path: /capabilities}
      - host: host.openshell.internal
        port: 8804
        path: /readyz
        protocol: rest
        enforcement: enforce
        credential_binding: {provider: vv-embedding-inference}
        rules:
          - allow: {method: GET, path: /readyz}
      - host: host.openshell.internal
        port: 8804
        path: /embeddings
        protocol: rest
        enforcement: enforce
        credential_binding: {provider: vv-embedding-inference}
        rules:
          - allow: {method: POST, path: /embeddings}
    binaries:
      - path: /usr/local/bin/veoveo-mcp-embedding
  database:
    endpoints:
      - host: host.openshell.internal
        port: 5432
        protocol: tcp
    binaries:
      - path: /usr/local/bin/veoveo-mcp-embedding
