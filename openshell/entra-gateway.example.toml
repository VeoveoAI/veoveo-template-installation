# Native gateway configuration. Example UUID is not an enrolled application.
[openshell]
version = 2

[openshell.gateway]
name = "veoveo-reference"
bind_address = "127.0.0.1:17670"
compute_driver = "docker"
policy_validation_failure_mode = "fail_closed"

# Native TCP forwarding capacity; SSH budgets remain independent.
[openshell.gateway.tcp_forwarding]
active_per_sandbox = 128
active_per_replica = 1024
pending_per_sandbox = 128
pending_per_replica = 512

[openshell.gateway.oidc]
issuer = "https://login.microsoftonline.com/11111111-1111-4111-8111-111111111111/v2.0"
# Actual aud of the selected OpenShell resource's access token, not its .default scope.
audience = "22222222-2222-4222-8222-222222222222"
roles_claim = "roles"
admin_role = "openshell-admin"
user_role = "openshell-user"
# Entra app-only tokens carry application permissions in roles, not delegated scp.
scopes_claim = "roles"

[openshell.gateway.auth]
allow_unauthenticated_users = false

[openshell.drivers.docker]
sandbox_label = "veoveo"
image_pull_policy = "if_not_present"
# Preserve the native Linux AppArmor default; do not copy the Mac exception.
allow_driver_config = true
enable_bind_mounts = false
# Select exact reviewed images through the native gateway environment.
# Keep resource_admission enabled and enable_bind_mounts false. Reviewed named
# volumes require allow_driver_config; that also admits native-validated tmpfs/CDI.

[openshell.drivers.docker.resource_admission]
enabled = true
