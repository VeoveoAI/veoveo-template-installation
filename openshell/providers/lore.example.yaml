id: veoveo-lore-repo
display_name: Hub-issued native Lore repository grant
credentials:
  - name: access_token
    env_vars: [LORE_AUTH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: oauth2_client_credentials
      token_url: https://veoveo.example.com/oauth/token
      scopes: [lore-repo-11111111111111111111111111111111]
      refresh_before: 60s
      max_lifetime: 300s
      material:
        - name: client_id
          required: true
        - name: client_secret
          required: true
          secret: true
