# Dedicated trusted Hub service identity; never attach to a user Computer.
# The Keycloak counterpart of entra-hub-native-control.example.yaml, for an installation
# that runs Keycloak in the cluster (identity/README.md#keycloak-in-the-cluster). The
# client is the realm's hub-native-control; its service account holds the openshell
# client's openshell-admin plus exactly config:read, workspace:read, workspace:write,
# sandbox:read, sandbox:write, provider:read and provider:write, which the realm import
# assigns and its mappers put in roles with the openshell audience. Not openshell:all.
id: vv-hub-native-control
display_name: Keycloak Hub native control
credentials:
  - name: access_token
    env_vars: [HUB_NATIVE_CONTROL_REFERENCE]
    required: true
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: oauth2_client_credentials
      token_url: https://auth.veoveo.example.com/realms/veoveo/protocol/openid-connect/token
      refresh_before: 180s
      max_lifetime: 3600s
      material:
        - name: client_id
          required: true
        - name: client_secret
          required: true
          secret: true
