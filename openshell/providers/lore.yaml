# One per Computer: Lore access as the Computer's owner, who pushes from it. The gateway
# refreshes it with the Computer's own Hub client. A Lore request names its repository in
# lore-partition-bin, and for it the supervisor asks the gateway for the owner's token of
# that repository (scope lore-repo-<id>), which Hub issues from the owner's grants, own and
# through groups; a request that names none carries the owner's token without a
# repository. Lore decides what each call may do. Factory
# instances use factory-lore.yaml, which admits only reads. Lore's command line, mounted read-only from the Lore
# image at /opt/veoveo/lore, reads the placeholder from LORE_ACCESS_TOKEN; only that
# binary receives the credential. Replace veoveo.example.com with Hub's host.
id: vv-lore
display_name: Lore access as a person
credentials:
  - name: access_token
    env_vars: [LORE_ACCESS_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: oauth2_client_credentials
      token_url: https://veoveo.example.com/oauth/token
      refresh_before: 60s
      max_lifetime: 300s
      request_scope:
        header: lore-partition-bin
        scope_template: lore-repo-{value}
      material:
        - name: client_id
          required: true
        - name: client_secret
          required: true
          secret: true
endpoints:
  - host: lore.veoveo-system.svc.cluster.local
    port: 41337
    protocol: rest
    enforcement: enforce
    rules:
      - allow: {method: POST, path: /**}
binaries:
  - /opt/veoveo/lore/usr/local/bin/lore
