# One per factory instance and one per Computer: Lore access as a person, the
# branch's latest pusher or the Computer's owner. The gateway refreshes it with the
# instance's or the Computer's own Hub client, which issues tokens for that person
# and the instance's repository or every repository the owner is assigned; Lore
# decides what each call may do. Lore's command line, mounted read-only from the Lore
# image at /opt/veoveo/lore, reads the placeholder from LORE_ACCESS_TOKEN; only that
# binary receives the credential. Replace veoveo.example.com with Hub's host.
id: vv-lore
display_name: Lore access as a person
credentials:
  - name: access_token
    env_vars: [LORE_ACCESS_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: oauth2_client_credentials
      token_url: https://veoveo.example.com/oauth/token
      refresh_before: 60s
      max_lifetime: 300s
      material:
        - name: client_id
          required: true
        - name: client_secret
          required: true
          secret: true
endpoints:
  - host: lore.veoveo-system.svc.cluster.local
    port: 41337
    protocol: rest
    enforcement: enforce
    rules:
      - allow: {method: POST, path: /**}
binaries:
  - /opt/veoveo/lore/usr/local/bin/lore
