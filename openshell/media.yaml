version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /lib64, /etc, /proc, /dev/urandom, /var/log]
  read_write: [/tmp, /dev/null, /var/lib/veoveo/media]
network_policies:
  registration:
    endpoints:
      - host: vv-control--hub--http.openshell.localhost
        port: 17670
        path: /oauth/register
        protocol: rest
        enforcement: enforce
        credential_binding: {provider: vv-media-registration}
        rules:
          - allow: {method: POST, path: /oauth/register}
    binaries:
      - path: /usr/local/bin/veoveo-mcp-media
  hub_metadata:
    endpoints:
      - host: vv-control--hub--http.openshell.localhost
        port: 17670
        path: /.well-known/oauth-authorization-server
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /.well-known/oauth-authorization-server}
      - host: vv-control--hub--http.openshell.localhost
        port: 17670
        path: /jwks.json
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /jwks.json}
      - host: vv-control--hub--http.openshell.localhost
        port: 17670
        path: /oauth/register/*
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /oauth/register/*}
          - allow: {method: DELETE, path: /oauth/register/*}
    binaries:
      - path: /usr/local/bin/veoveo-mcp-media
  hub_token_exchange:
    endpoints:
      - host: vv-control--hub--http.openshell.localhost
        port: 17670
        path: /oauth/token
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: POST, path: /oauth/token}
    binaries:
      - path: /usr/local/bin/veoveo-mcp-media
  artifact_calls:
    # Disjoint from the REST registration/metadata/token paths above.
    endpoints:
      - host: vv-control--hub--http.openshell.localhost
        port: 17670
        path: /mcp/local
        protocol: mcp
        enforcement: enforce
        mcp:
          versions: ["2026-07-28"]
          allow_all_known_mcp_methods: false
        rules:
          - allow: {method: server/discover}
          - allow: {method: ping}
          - allow: {method: tools/list}
          - allow: {method: tools/call, tool: artifact__create_upload}
          - allow: {method: tools/call, tool: artifact__sign_upload_parts}
          - allow: {method: tools/call, tool: artifact__complete_upload}
          - allow: {method: tools/call, tool: artifact__abort_upload}
          - allow: {method: resources/read}
          # Native MCP resource subscriptions.
          - allow: {method: subscriptions/listen}
    binaries:
      - path: /usr/local/bin/veoveo-mcp-media
  generation:
    endpoints:
      - host: vv-services--media-provider--http.openshell.localhost
        port: 17670
        path: /api/v3/**
        protocol: rest
        enforcement: enforce
        credential_binding: {provider: vv-media-generation}
        rules:
          - allow: {method: GET, path: /api/v3/models}
          - allow: {method: GET, path: /api/v3/predictions/*/result}
          - allow: {method: POST, path: /api/v3/**}
      - host: vv-services--media-provider--http.openshell.localhost
        port: 17670
        path: /outputs/**
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /outputs/*/*}
    binaries:
      - path: /usr/local/bin/veoveo-mcp-media
  database:
    endpoints:
      - host: host.openshell.internal
        port: 5432
        protocol: tcp
    binaries:
      - path: /usr/local/bin/veoveo-mcp-media
  object_storage:
    # SigV4 binds the original host and headers. Bytes bypass HTTP interception.
    endpoints:
      - host: host.openshell.internal
        port: 9000
        protocol: tcp
    binaries:
      - path: /usr/local/bin/veoveo-mcp-media
