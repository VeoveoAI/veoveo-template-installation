# Computer-enabled Hub only; replace origins together with computer/hub.example.json.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /lib64, /etc, /proc, /dev/urandom, /var/log, /var/lib/veoveo]
  read_write: [/tmp, /dev/null]
network_policies:
  native_control:
    # One REST configuration permits native HTTP/2 ALPN for tonic/gRPC.
    # The root selector routes requests; the exact rules below grant RPC access.
    endpoints:
      - host: host.openshell.internal
        port: 17670
        path: /openshell.v1.OpenShell/**
        protocol: rest
        enforcement: enforce
        credential_binding: {provider: vv-hub-native-control}
        rules:
          - allow: {method: POST, path: /openshell.v1.OpenShell/GetGatewayInfo}
          - allow: {method: POST, path: /openshell.v1.OpenShell/ForwardTcp}
          - allow: {method: POST, path: /openshell.v1.OpenShell/GetProviderProfile}
          - allow: {method: POST, path: /openshell.v1.OpenShell/GetWorkspace}
          - allow: {method: POST, path: /openshell.v1.OpenShell/CreateWorkspace}
          - allow: {method: POST, path: /openshell.v1.OpenShell/GetSandboxTemplate}
          - allow: {method: POST, path: /openshell.v1.OpenShell/CreateSandboxTemplate}
          - allow: {method: POST, path: /openshell.v1.OpenShell/GetProvider}
          - allow: {method: POST, path: /openshell.v1.OpenShell/CreateProvider}
          - allow: {method: POST, path: /openshell.v1.OpenShell/GetSandbox}
          - allow: {method: POST, path: /openshell.v1.OpenShell/CreateSandbox}
          - allow: {method: POST, path: /openshell.v1.OpenShell/StartSandbox}
          - allow: {method: POST, path: /openshell.v1.OpenShell/StopSandbox}
          - allow: {method: POST, path: /openshell.v1.OpenShell/ConfigureProviderRefresh}
          - allow: {method: POST, path: /openshell.v1.OpenShell/RotateProviderCredential}
    binaries:
      - path: /usr/local/bin/veoveo-hub
  browser_code_exchange:
    endpoints:
      - host: veoveo.example.com
        port: 443
        path: /oauth/token
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: POST, path: /oauth/token}
    binaries:
      - path: /usr/local/bin/veoveo-hub
  browser_identity_exchange:
    endpoints:
      - host: auth.localhost
        port: 8443
        path: /realms/veoveo/protocol/openid-connect/token
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: POST, path: /realms/veoveo/protocol/openid-connect/token}
    binaries:
      - path: /usr/local/bin/veoveo-hub
  issuer_keys:
    endpoints:
      - host: host.openshell.internal
        port: 8443
        path: /realms/veoveo/protocol/openid-connect/certs
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /realms/veoveo/protocol/openid-connect/certs}
    binaries:
      - path: /usr/local/bin/veoveo-hub
  database:
    endpoints:
      - host: host.openshell.internal
        port: 5432
        protocol: tcp
    binaries:
      - path: /usr/local/bin/veoveo-hub
