# Direct IdP grants validated by native Lore. Factory assignments are trusted.
[hooks.factory_branch]
enabled = true
assignments = {}

[server.auth]
jwt_issuer = "https://auth.localhost:8443/realms/veoveo"
jwt_audience = ["lores://vv-lore.internal:41337"]
jwt_typ = "at+jwt"
resource_claim = "resources"
resource_id_claim = "resource_id"
permission_claim = "permission"
resource_id_template = "urc-{id}"
baseline_access = "denied"
repository_catalog = "baseline"

[server.auth.oidc]
client_id = "lore-cli"
scopes = ["openid"]
scope_template = "lore-repo-{id}"

[server.quic]
enabled = false

[server.grpc.certificate]
cert_file = "/etc/lore/tls/vv-lore.internal.crt"
pkey_file = "/etc/lore/tls/vv-lore.internal.key"

[immutable_store]
mode = "s3_postgres"

[mutable_store]
mode = "s3_postgres"

# Resource locks coordinate one owning Lore process, not a multi-server cluster.
[lock_store]
mode = "local"

[plugins.s3_postgres]
postgres_url_env = "LORE_POSTGRES_URL"
schema = "lore"
s3_bucket = "lore"
s3_endpoint_url = "http://vv-seaweedfs.internal:9000"
s3_region = "us-east-1"
s3_force_path_style = true
