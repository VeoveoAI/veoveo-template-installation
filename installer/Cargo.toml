[package]
name = "veoveo-installer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/VeoveoAI/veoveo-template-installation"
publish = false
description = "Makes a cluster match this installation repository: plan shows the difference"

[dependencies]
anyhow = "=1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
futures = "0.3.34"
k8s-openapi = { version = "0.28", default-features = false, features = ["latest"] }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring"] }
# OpenShell's own client, policy and profile crates, at the revision the installation's
# gateway runs, so plan reads every profile field the gateway serves.
openshell-policy = { git = "https://github.com/VeoveoAI/OpenShell", rev = "ab37a698cfd03cdfb2559af7fd4263075233a48a", version = "0.0.0" }
openshell-providers = { git = "https://github.com/VeoveoAI/OpenShell", rev = "ab37a698cfd03cdfb2559af7fd4263075233a48a", version = "0.0.0" }
openshell-sdk = { git = "https://github.com/VeoveoAI/OpenShell", rev = "ab37a698cfd03cdfb2559af7fd4263075233a48a", version = "0.0.0" }
prost-types = "=0.14.4"
ring = "0.17.14"
reqwest = { version = "=0.13.5", default-features = false, features = ["form", "json", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde-saphyr = "0.0.29"
sha2 = "=0.11.0"
similar = "2.7"
tokio = { version = "1.53.1", features = ["macros", "process", "rt-multi-thread", "time", "fs"] }
toml = "1.1"
tonic = "=0.14.6"
url = "=2.5.8"
uuid = { version = "1.25.0", features = ["v4"] }
# The component lock, read with core's installation contract.
veoveo-installation-contract = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "04560dce911282156d86e925d2f18853979236d3" }
# The Hub SDK's browser sign-in and stored grant, at the SDK revision the lock pins, and
# the core types it names.
veoveo-hub-sdk = { git = "https://github.com/VeoveoAI/veoveo-hub-sdk", rev = "a41c9cc6c81f6c0305dd41165defb142740ed6b1", default-features = false, features = ["client"] }
veoveo-hub-sdk-cli = { git = "https://github.com/VeoveoAI/veoveo-hub-sdk", rev = "a41c9cc6c81f6c0305dd41165defb142740ed6b1" }
veoveo-types = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "120306eb969c6134dadd422dca701a2ce63e9492" }

[dev-dependencies]
pretty_assertions = "1.4"
