# cargo-deny 0.20 policy: dependency licenses, security advisories, bans and sources.

[graph]
all-features = true

[advisories]
ignore = [
    # Unmaintained with no vulnerability and no patched release; these go when the graph drops them.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, with no patched release; core and the SDK use it, and rmcp, schemars and sqlx depend on it" },
]
unused-ignored-advisory = "deny"

[licenses]
# Licenses compatible with distributing an Apache-2.0 project. Add a license here only
# after reviewing it, and record crate-specific cases under `exceptions`.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The upstream source remains allowed; allow-org admits the reviewed VeoveoAI fork.
# Cargo.toml/lock retain the exact reviewed revision.
allow-git = ["https://github.com/NVIDIA/OpenShell"]

[sources.allow-org]
github = ["VeoveoAI"]
