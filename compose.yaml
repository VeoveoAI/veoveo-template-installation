# Trusted bootstrap only. All factory and MCP workloads run through OpenShell.
name: vv-local
networks:
  vv-identity:
    internal: true
    ipam:
      config:
      - subnet: 10.231.12.0/29
  vv-local:
    internal: true
    ipam:
      config:
      - subnet: 10.231.10.0/24
  vv-outside: {}
services:
  vv-keycloak-db:
    container_name: vv-keycloak-db
    profiles:
    - keycloak
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    user: postgres
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    env_file:
    - path: ./state/identity/database.env
      required: false
    environment:
      POSTGRES_DB: keycloak
    networks:
      vv-identity:
        ipv4_address: 10.231.12.4
        aliases:
        - vv-keycloak-db.internal
    volumes:
    - vv-keycloak-db:/var/lib/postgresql
    - ./identity/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD
      - pg_isready
      - --host
      - 127.0.0.1
      - --username
      - postgres
      - --dbname
      - keycloak
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  vv-keycloak:
    container_name: vv-keycloak
    profiles:
    - keycloak
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    env_file:
    - path: ./state/identity/keycloak.env
      required: false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://vv-keycloak-db.internal:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: https://auth.localhost:8443
      KC_HOSTNAME_STRICT: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: 10.231.12.2
      KC_HEALTH_ENABLED: 'true'
      KC_CACHE: local
      KC_HTTP_POOL_MAX_THREADS: '50'
    command:
    - start
    healthcheck:
      test:
      - CMD
      - bash
      - -ec
      - 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; read
        -r status <&3; [[ "$$status" == *" 200 "* ]]'
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 2g
    pids_limit: 256
    depends_on:
      vv-keycloak-db:
        condition: service_healthy
    networks:
      vv-identity:
        ipv4_address: 10.231.12.3
        aliases:
        - vv-keycloak.internal
    restart: unless-stopped
  vv-identity-edge:
    container_name: vv-identity-edge
    profiles:
    - keycloak
    image: envoyproxy/envoy:v1.40.0@sha256:459f2a6404c340fe6afccd69d85527012d47f3c036765493e6f8f3113fa384de
    user: root
    environment:
      ENVOY_UID: '0'
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    read_only: true
    command:
    - -c
    - /etc/envoy/envoy.yaml
    - --log-level
    - warn
    networks:
      vv-identity:
        ipv4_address: 10.231.12.2
      vv-local:
        aliases:
        - auth.localhost
      vv-outside: {}
    ports:
    - 127.0.0.1:8443:8443
    volumes:
    - ./identity/envoy.yaml:/etc/envoy/envoy.yaml:ro
    - ./tls/identity:/etc/envoy/tls:ro
    restart: unless-stopped
  vv-postgres:
    container_name: vv-postgres
    build:
      context: ./postgres
    image: veoveo-postgres:18.6-extensions
    environment:
      POSTGRES_PASSWORD: ${VEOVEO_POSTGRES_PASSWORD:?set VEOVEO_POSTGRES_PASSWORD to the superuser password before
        starting}
      VEOVEO_DATABASE_PASSWORD: ${VEOVEO_DATABASE_PASSWORD:?set VEOVEO_DATABASE_PASSWORD to the installation owner
        password before starting}
    command:
    - postgres
    - -c
    - tcp_keepalives_idle=10
    - -c
    - tcp_keepalives_interval=5
    - -c
    - tcp_keepalives_count=3
    networks:
      vv-local:
        aliases:
        - vv-postgres.internal
      vv-outside: {}
    ports:
    - 127.0.0.1:${VEOVEO_DATABASE_PORT:-5432}:5432
    volumes:
    - vv-postgres:/var/lib/postgresql
    - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD
      - pg_isready
      - --host
      - 127.0.0.1
      - --username
      - veoveo_owner
      - --dbname
      - veoveo
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  vv-seaweedfs:
    container_name: vv-seaweedfs
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command:
    - mini
    - -dir=/data
    - -s3.port=9000
    - -s3.cert.file=${VEOVEO_STORAGE_TLS_CERT_FILE:-}
    - -s3.key.file=${VEOVEO_STORAGE_TLS_KEY_FILE:-}
    - -admin.ui=true
    - -admin.password=${VEOVEO_SEAWEEDFS_ADMIN_PASSWORD:?set VEOVEO_SEAWEEDFS_ADMIN_PASSWORD to the admin UI's password
      before starting}
    - -webdav=false
    - -s3.port.iceberg=0
    - -s3.port.lance=0
    environment:
      AWS_ACCESS_KEY_ID: ${VEOVEO_STORAGE_ACCESS_KEY:?set VEOVEO_STORAGE_ACCESS_KEY to the object store's access
        key before starting}
      AWS_SECRET_ACCESS_KEY: ${VEOVEO_STORAGE_SECRET_KEY:?set VEOVEO_STORAGE_SECRET_KEY to the object store's secret
        key before starting}
    networks:
      vv-local:
        aliases:
        - vv-seaweedfs.internal
      vv-outside: {}
    ports:
    - 127.0.0.1:${VEOVEO_STORAGE_PORT:-9000}:9000
    - 127.0.0.1:${VEOVEO_SEAWEEDFS_ADMIN_PORT:-23646}:23646
    volumes:
    - vv-seaweedfs:/data
    restart: unless-stopped
  vv-lore:
    container_name: vv-lore
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    image: vv-lore:local
    env_file:
    - ./state/openshell/lore-direct/storage.env
    depends_on:
      vv-postgres:
        condition: service_healthy
      vv-seaweedfs:
        condition: service_started
    build:
      context: .
      dockerfile: factory/Lore.Dockerfile
      target: runtime
      additional_contexts:
        lore-source: ./state/openshell/lore-s3-postgres-7785408e70ed302296a24383ae302c3a606e78c3
        ca: ./tls/ca
    networks:
      vv-local:
        ipv4_address: 10.231.10.10
        aliases:
        - vv-lore.internal
    volumes:
    - vv-lore:/data
    - ./state/openshell/lore-direct/server.toml:/etc/lore/config/local.toml:ro
    - ./tls/lore:/etc/lore/tls:ro
    restart: unless-stopped
volumes:
  vv-keycloak-db:
    external: true
    name: vv-local_vv-keycloak-db
  vv-postgres:
    external: true
    name: vv-local_vv-postgres
  vv-seaweedfs:
    external: true
    name: vv-local_vv-seaweedfs
  vv-lore:
    external: true
    name: vv-local_vv-lore
