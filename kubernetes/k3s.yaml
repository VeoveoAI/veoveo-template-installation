# /etc/rancher/k3s/config.yaml — Linux only, K3s v1.36.5+k3s1.
# Confirm these ranges do not overlap the installation network before bootstrap.
cluster-cidr: 10.42.0.0/16
service-cidr: 10.43.0.0/16
flannel-backend: none
disable-network-policy: true
disable:
  - traefik
  - servicelb
write-kubeconfig-mode: "0600"
secrets-encryption: true
# Keep kube-proxy. Cilium uses Kubernetes IPAM without kube-proxy replacement.
