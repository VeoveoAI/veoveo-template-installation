# Apply only AFTER native `workspace create --name vv-control`. This namespace is the
# native managed-mode result for gateway ID openshell and workspace vv-control.
# If either changes, use the actual native namespace; do not create another one.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hub-config-v1
  namespace: openshell-openshell-vv-control
  labels:
    openshell.ai/sandbox-attachable: "true"
    openshell.ai/sandbox-attachable-workspace: vv-control
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-hub-config-v1
  namespace: openshell-openshell-vv-control
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          image: REPLACE_WITH_REVIEWED_COPY_IMAGE_AT_SHA256
          command: [/bin/sh, -ec]
          args:
            # Replace each file in the existing claim by renaming a complete copy over it,
            # so the claim and its UID stay. No file changes unless every copy succeeds.
            - |
              umask 077
              files="hub.json hub.env computer-policy-v1.yaml factory-base-v1.yaml authorization-server.jwks.json"
              trap 'for f in $files; do rm -f "/output/.$f.new"; done' EXIT
              for f in $files; do
                cp "/input/$f" "/output/.$f.new"
                chmod 0600 "/output/.$f.new"
              done
              for f in $files; do mv -f "/output/.$f.new" "/output/$f"; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: source
              mountPath: /input
              readOnly: true
            - name: output
              mountPath: /output
      volumes:
        - name: source
          secret:
            secretName: hub-config-bootstrap
            defaultMode: 0440
            items:
              - key: hub.json
                path: hub.json
              - key: hub.env
                path: hub.env
              - key: computer-policy-v1.yaml
                path: computer-policy-v1.yaml
              - key: factory-base-v1.yaml
                path: factory-base-v1.yaml
              - key: authorization-server.jwks.json
                path: authorization-server.jwks.json
        - name: output
          persistentVolumeClaim:
            claimName: hub-config-v1
