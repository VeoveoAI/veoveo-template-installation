# Official NVIDIA chart 0.20.1; Linux/amd64 manifest, not the multiarch index.
# Chart's native fullimage helper concatenates repository:tag (no digest field).
image:
  repository: nvcr.io/nvidia/k8s-device-plugin
  tag: v0.20.1@sha256:d279ecdb47b252c4cd96f4224650e9808c36012f6979570c9611ddbc5b0749a7
  pullPolicy: IfNotPresent
runtimeClassName: nvidia
failOnInitError: true
migStrategy: none
deviceListStrategy: envvar
deviceIDStrategy: uuid
devicePlugin:
  enabled: true
gfd:
  enabled: false
nfd:
  enabled: false
# No ConfigMap means no time-sharing/MPS configuration or config-manager sidecar.
config:
  name: ""
  map: {}
# Retain the official GPU affinity. With NFD/GFD disabled, the operator must
# label only the verified GPU node nvidia.com/gpu.present=true before admission.
nodeSelector:
  kubernetes.io/os: linux
  kubernetes.io/arch: amd64
