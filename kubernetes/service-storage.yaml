# Operator bootstrap only, AFTER native vv-services provider custody creates its namespace.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: time-state-v1
  namespace: openshell-openshell-vv-services
  labels:
    openshell.ai/sandbox-attachable: 'true'
    openshell.ai/sandbox-attachable-workspace: vv-services
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
