# Public PostgreSQL, storage and native repository trust only, in each actual native workspace namespace.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-client-ca-v1
  namespace: openshell-openshell-vv-control
  labels:
    openshell.ai/sandbox-attachable: 'true'
    openshell.ai/sandbox-attachable-workspace: vv-control
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-postgres-client-ca-v1
  namespace: openshell-openshell-vv-control
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: copy
        image: REPLACE_WITH_REVIEWED_COPY_IMAGE_AT_SHA256
        command:
        - /bin/sh
        - -ec
        args:
        # Replace each file in the existing claim by renaming a complete copy over it,
        # so the claim and its UID stay. No file changes unless every copy succeeds.
        - |
          umask 022
          files="postgres-ca.crt storage-ca.crt lore-ca.crt"
          trap 'for f in $files; do rm -f "/output/.$f.new"; done' EXIT
          for f in $files; do
            cp "/input/$f" "/output/.$f.new"
            chmod 0444 "/output/.$f.new"
          done
          for f in $files; do mv -f "/output/.$f.new" "/output/$f"; done
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: input
          mountPath: /input
          readOnly: true
        - name: output
          mountPath: /output
      volumes:
      - name: input
        configMap:
          name: postgres-client-ca
          items:
          - key: postgres-ca.crt
            path: postgres-ca.crt
          - key: storage-ca.crt
            path: storage-ca.crt
          - key: lore-ca.crt
            path: lore-ca.crt
      - name: output
        persistentVolumeClaim:
          claimName: postgres-client-ca-v1
---
