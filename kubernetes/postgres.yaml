# Requires CloudNativePG 1.30.1. Replace imageName with the published Linux
# postgres/Dockerfile image@sha256 and confirm its UID/GID before applying.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: veoveo-postgres
  namespace: veoveo-system
spec:
  instances: 1
  imageName: REPLACE_WITH_EXTENSION_IMAGE_AT_SHA256
  imagePullSecrets:
    - name: registry-pull
  postgresUID: 999
  postgresGID: 999
  storage:
    storageClass: local-path
    size: 50Gi
  bootstrap:
    initdb:
      database: veoveo
      owner: veoveo_owner
      secret:
        name: veoveo-owner-db
  managed:
    roles:
      - name: veoveo_owner
        ensure: present
        login: true
        createrole: true
        passwordSecret:
          name: veoveo-owner-db
      - name: openshell_gateway
        ensure: present
        login: true
        passwordSecret:
          name: openshell-gateway-role
      - name: server_lore
        ensure: present
        login: true
        passwordSecret:
          name: lore-db
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: openshell-gateway
  namespace: veoveo-system
spec:
  name: openshell_gateway
  owner: openshell_gateway
  cluster:
    name: veoveo-postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: veoveo-applications
  namespace: veoveo-system
spec:
  name: veoveo
  owner: veoveo_owner
  cluster:
    name: veoveo-postgres
  extensions:
    - name: vector
      ensure: present
    - name: postgis
      ensure: present
  schemas:
    - name: lore
      owner: server_lore
      ensure: present
