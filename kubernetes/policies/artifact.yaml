# Kubernetes Service and unchanged public issuer inputs; preserve exact native rules.
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /bin
  - /usr
  - /lib
  - /lib64
  - /etc
  - /proc
  - /dev/urandom
  - /var/log
  read_write:
  - /tmp
  - /dev/null
  - /var/lib/veoveo/artifact
network_policies:
  registration:
    endpoints:
    - host: veoveo.example.com
      port: 443
      path: /oauth/register
      protocol: rest
      enforcement: enforce
      credential_binding:
        provider: vv-artifact-registration
      rules:
      - allow:
          method: POST
          path: /oauth/register
    binaries:
    - path: /usr/local/bin/veoveo-mcp-artifact
  hub_metadata:
    endpoints:
    - host: veoveo.example.com
      port: 443
      path: /.well-known/oauth-authorization-server
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /.well-known/oauth-authorization-server
    - host: veoveo.example.com
      port: 443
      path: /jwks.json
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /jwks.json
    - host: veoveo.example.com
      port: 443
      path: /oauth/register/*
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /oauth/register/*
      - allow:
          method: DELETE
          path: /oauth/register/*
    binaries:
    - path: /usr/local/bin/veoveo-mcp-artifact
  database:
    endpoints:
    - host: veoveo-postgres-rw.veoveo-system.svc.cluster.local
      port: 5432
      protocol: tcp
      tls: skip
    binaries:
    - path: /usr/local/bin/veoveo-mcp-artifact
  object_storage:
    endpoints:
    - host: seaweedfs-s3.veoveo-system.svc.cluster.local
      port: 9000
      protocol: tcp
      tls: skip
    binaries:
    - path: /usr/local/bin/veoveo-mcp-artifact
