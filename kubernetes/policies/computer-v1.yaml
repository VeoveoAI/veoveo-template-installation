# Kubernetes Service inputs; preserve exact native rules and provider bindings.
# Lore's endpoint and credential come from the attached computer-lore provider of
# the global vv-lore profile, whose inspected endpoint substitutes the owner's token.
# Lore and the Hub SDK CLI are the read-only image volumes of computer-driver-config.json.
# The hub rule admits the owner's MCP endpoint for OpenCode and for the mounted Hub SDK
# CLI, whose bearer is the same COMPUTER_HUB_REFERENCE placeholder; the model rule stays
# OpenCode's alone. The internet rule is the factory's open internet access, for any
# program: every name of three or more labels plus the two-label names in use, on ports
# 80 and 443. A program that a rule for an exact host names keeps to that rule there, and
# hub_computer names every program on Hub's host. OpenShell keeps private addresses closed
# to wildcard rules.
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /bin
  - /usr
  - /lib
  - /lib64
  - /etc
  - /proc
  - /dev/urandom
  - /var/log
  - /opt/veoveo/lore
  - /opt/veoveo/hub-sdk-cli
  read_write:
  - /sandbox
  - /tmp
  - /dev/null
  # Native terminal PTYs use the multiplexer and dynamic slaves under devpts.
  - /dev/pts
network_policies:
  hub:
    endpoints:
    - host: veoveo.example.com
      port: 443
      path: /mcp/computer
      protocol: mcp
      enforcement: enforce
      credential_binding:
        provider: computer-hub
      mcp:
        versions:
        - '2026-07-28'
        allow_all_known_mcp_methods: true
    binaries:
    - path: /usr/local/bin/opencode
    - path: /opt/veoveo/hub-sdk-cli/usr/local/bin/veoveo-hub-sdk-cli
  hub_computer:
    # The Computer's own status, restart and previous version, for any program in it:
    # the proxy puts the owner's Hub token in place of the COMPUTER_HUB_REFERENCE
    # placeholder, which Hub admits for its Computers profile.
    endpoints:
    - host: veoveo.example.com
      port: 443
      path: /computer/*
      protocol: rest
      enforcement: enforce
      credential_binding:
        provider: computer-hub
      rules:
      - allow:
          method: GET
          path: /computer/status
      - allow:
          method: POST
          path: /computer/restart
      - allow:
          method: POST
          path: /computer/previous
    binaries:
    - path: /**
  model:
    endpoints:
    - host: api.deepinfra.com
      port: 443
      path: /v1/openai/chat/completions
      protocol: rest
      enforcement: enforce
      credential_binding:
        provider: computer-model
      # A chat's history is text the person and the agent wrote, and it may quote a
      # credential placeholder, as from printing the environment. Inspection would
      # refuse every later request of that chat; the key stays bound to the header.
      allow_uninspected_credentials: true
      rules:
      - allow:
          method: POST
          path: /v1/openai/chat/completions
    binaries:
    - path: /usr/local/bin/opencode
  artifact_bytes:
    # Artifact's signed object URLs, under /artifacts/ on the public host. No
    # credential binding: the proxy forwards their method, Host, path, query,
    # headers and body as signed.
    endpoints:
    - host: veoveo.example.com
      port: 443
      path: /artifacts/**
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: PUT
          path: /artifacts/**
      - allow:
          method: GET
          path: /artifacts/**
    binaries:
    - path: /usr/bin/curl
  internet:
    endpoints:
    - host: '**.*.*'
      ports: [80, 443]
    - host: github.com
      ports: [80, 443]
    - host: crates.io
      ports: [80, 443]
    binaries:
    - path: /**
