# Native MCP, Artifact delegation and private inference; no GPU on this service.
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /bin
  - /usr
  - /lib
  - /lib64
  - /etc
  - /proc
  - /dev/urandom
  - /var/log
  read_write:
  - /tmp
  - /dev/null
  - /var/lib/veoveo/embedding
network_policies:
  registration:
    endpoints:
    - host: veoveo.example.com
      port: 443
      path: /oauth/register
      protocol: rest
      enforcement: enforce
      credential_binding:
        provider: vv-embedding-registration
      rules:
      - allow:
          method: POST
          path: /oauth/register
    binaries:
    - path: /usr/local/bin/veoveo-mcp-embedding
  hub_metadata:
    endpoints:
    - host: veoveo.example.com
      port: 443
      path: /.well-known/oauth-authorization-server
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /.well-known/oauth-authorization-server
    - host: veoveo.example.com
      port: 443
      path: /jwks.json
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /jwks.json
    - host: veoveo.example.com
      port: 443
      path: /oauth/register/*
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /oauth/register/*
      - allow:
          method: DELETE
          path: /oauth/register/*
    binaries:
    - path: /usr/local/bin/veoveo-mcp-embedding
  hub_token_exchange:
    endpoints:
    - host: veoveo.example.com
      port: 443
      path: /oauth/token
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: POST
          path: /oauth/token
    binaries:
    - path: /usr/local/bin/veoveo-mcp-embedding
  artifact_calls:
    endpoints:
    - host: veoveo.example.com
      port: 443
      path: /mcp/local
      protocol: mcp
      enforcement: enforce
      mcp:
        versions:
        - '2026-07-28'
        allow_all_known_mcp_methods: false
      # Native ServerCalls supplies the delegated JWT; do not bind a static
      # member/admin provider to this same-origin MCP group.
      rules:
      - allow:
          method: server/discover
      - allow:
          method: ping
      - allow:
          method: tools/list
      - allow:
          method: tools/call
          tool: artifact__create_download
    binaries:
    - path: /usr/local/bin/veoveo-mcp-embedding
  embedding_runtime:
    endpoints:
    - host: vv-services--embedding-runtime--http.openshell.localhost
      port: 8080
      path: /capabilities
      protocol: rest
      enforcement: enforce
      credential_binding:
        provider: vv-embedding-inference
      rules:
      - allow:
          method: GET
          path: /capabilities
    - host: vv-services--embedding-runtime--http.openshell.localhost
      port: 8080
      path: /readyz
      protocol: rest
      enforcement: enforce
      credential_binding:
        provider: vv-embedding-inference
      rules:
      - allow:
          method: GET
          path: /readyz
    - host: vv-services--embedding-runtime--http.openshell.localhost
      port: 8080
      path: /embeddings
      protocol: rest
      enforcement: enforce
      credential_binding:
        provider: vv-embedding-inference
      rules:
      - allow:
          method: POST
          path: /embeddings
    binaries:
    - path: /usr/local/bin/veoveo-mcp-embedding
  database:
    endpoints:
    - host: veoveo-postgres-rw.veoveo-system.svc.cluster.local
      port: 5432
      protocol: tcp
      tls: skip
    binaries:
    - path: /usr/local/bin/veoveo-mcp-embedding
