# Kubernetes Service inputs; preserve exact native rules and provider bindings.
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /bin
  - /usr
  - /lib
  - /lib64
  - /etc
  - /proc
  - /dev/urandom
  - /var/log
  read_write:
  - /sandbox
  - /tmp
  - /dev/null
network_policies:
  lore:
    endpoints:
    - host: lore.veoveo-system.svc.cluster.local
      port: 41337
      protocol: rest
      enforcement: enforce
      credential_binding:
        provider: vv-lore-time
      rules:
      - allow:
          method: POST
          path: /lore.environment.v1.EnvironmentService/EnvironmentGet
      - allow:
          method: POST
          path: /urc.rpc.EnvironmentService/Get
      - allow:
          method: POST
          path: /lore.repository.v1.RepositoryService/RepositoryGet
      - allow:
          method: POST
          path: /lore.repository.v1.RepositoryService/RepositoryMetadataGet
      - allow:
          method: POST
          path: /lore.storage.v1.StorageService/Get
      - allow:
          method: POST
          path: /lore.storage.v1.StorageService/GetMetadata
      - allow:
          method: POST
          path: /lore.storage.v1.StorageService/GetResolved
      - allow:
          method: POST
          path: /lore.storage.v1.StorageService/Query
      - allow:
          method: POST
          path: /lore.storage.v1.StorageService/MutableLoad
      - allow:
          method: POST
          path: /urc.rpc.RepositoryService/Info
      - allow:
          method: POST
          path: /lore.repository.v1.RepositoryService/RepositoryCreate
      - allow:
          method: POST
          path: /lore.revision.v1.RevisionService/BranchGet
      - allow:
          method: POST
          path: /lore.revision.v1.RevisionService/BranchList
      - allow:
          method: POST
          path: /lore.revision.v1.RevisionService/BranchMetadataGet
      - allow:
          method: POST
          path: /lore.revision.v1.RevisionService/BranchMetadataSet
      - allow:
          method: POST
          path: /lore.revision.v1.RevisionService/RevisionList
      - allow:
          method: POST
          path: /lore.revision.v1.RevisionService/BranchCreate
      - allow:
          method: POST
          path: /lore.revision.v1.RevisionService/BranchPush
      - allow:
          method: POST
          path: /lore.storage.v1.StorageService/Put
    binaries:
    - path: /usr/local/bin/lore
