# Base policy of every factory sandbox. The branch's checkout lives in /sandbox/src,
# where its build puts the server it runs. The Lore and registration endpoints, with
# their credentials, come from the attached providers of the vv-factory-lore and
# vv-factory-registration profiles, and vv-factory-lore admits Lore's read methods only; Lore's command line is the read-only image volume
# of factory-driver-config.json. Factory sandboxes have open internet access: every
# name of three or more labels plus the two-label names in use, on ports 80 and 443.
# Inspected rules for exact hosts, such as Hub's, still apply to those hosts, and
# OpenShell keeps private addresses closed to wildcard rules. Replace
# veoveo.example.com with Hub's host.
version: 1
filesystem_policy:
  include_workdir: true
  # The GPU's device nodes exist only in a sandbox whose image asks the nvidia runtime for
  # them, and a path that does not exist is skipped. OpenShell adds them itself only for a
  # sandbox with a GPU resource claim, which a factory sandbox does not have.
  read_only: [/bin, /usr, /lib, /lib64, /etc, /proc, /dev/urandom, /var/log, /opt/veoveo/lore, /run/nvidia-persistenced]
  read_write: [/sandbox, /tmp, /dev/null, /dev/nvidiactl, /dev/nvidia0, /dev/nvidia-uvm, /dev/nvidia-uvm-tools, /dev/nvidia-modeset]
network_policies:
  hub_metadata:
    endpoints:
      - host: veoveo.example.com
        port: 443
        path: /.well-known/oauth-authorization-server
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /.well-known/oauth-authorization-server}
      - host: veoveo.example.com
        port: 443
        path: /jwks.json
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /jwks.json}
      - host: veoveo.example.com
        port: 443
        path: /oauth/register/*
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /oauth/register/*}
          - allow: {method: PUT, path: /oauth/register/*}
          - allow: {method: DELETE, path: /oauth/register/*}
      - host: veoveo.example.com
        port: 443
        path: /oauth/token
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: POST, path: /oauth/token}
    binaries:
      - path: /sandbox/src/**
  # A server reads a repository's files through Hub's route, as the person it works for.
  # Hub and Lore decide each read.
  hub_lore_files:
    endpoints:
      - host: veoveo.example.com
        port: 443
        path: /lore/**
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /lore/*/repositories}
          - allow: {method: GET, path: /lore/*/repositories/*/files/**}
          - allow: {method: GET, path: /lore/*/repositories/*/tree/*}
    binaries:
      - path: /sandbox/src/**
  # Uploads to the URLs Artifact signs, under /artifacts/ on the public host. No credential
  # binding: the proxy forwards their method, Host, path, query, headers and body as signed.
  artifact_bytes:
    endpoints:
      - host: veoveo.example.com
        port: 443
        path: /artifacts/**
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: PUT, path: /artifacts/**}
          - allow: {method: GET, path: /artifacts/**}
    binaries:
      - path: /sandbox/src/**
  database:
    endpoints:
      - host: veoveo-postgres-rw.veoveo-system.svc.cluster.local
        port: 5432
        protocol: tcp
        tls: skip
    binaries:
      - path: /sandbox/src/**
  internet:
    endpoints:
      - {host: "**.*.*", ports: [80, 443]}
      # OpenShell refuses a wildcard of two labels or fewer, so a bare name people need is listed here.
      # Python
      - {host: pypi.org, ports: [80, 443]}
      - {host: astral.sh, ports: [80, 443]}
      # JavaScript
      - {host: nodejs.org, ports: [80, 443]}
      - {host: bun.sh, ports: [80, 443]}
      - {host: deno.land, ports: [80, 443]}
      - {host: jsr.io, ports: [80, 443]}
      - {host: unpkg.com, ports: [80, 443]}
      # Rust and Go
      - {host: crates.io, ports: [80, 443]}
      - {host: go.dev, ports: [80, 443]}
      - {host: golang.org, ports: [80, 443]}
      - {host: gopkg.in, ports: [80, 443]}
      # Other languages
      - {host: rubygems.org, ports: [80, 443]}
      - {host: getcomposer.org, ports: [80, 443]}
      - {host: pub.dev, ports: [80, 443]}
      # Source
      - {host: github.com, ports: [80, 443]}
      - {host: gitlab.com, ports: [80, 443]}
      - {host: bitbucket.org, ports: [80, 443]}
      - {host: codeberg.org, ports: [80, 443]}
      # Models
      - {host: huggingface.co, ports: [80, 443]}
      - {host: hf.co, ports: [80, 443]}
    binaries:
      - path: /**
