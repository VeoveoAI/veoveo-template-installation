# Full-model CUDA runtime. --gpu 1 supplies native GPU filesystem admission.
# Only the public host, where Artifact's signed object URLs are, is reachable. TLS
# stays end-to-end: the runtime's HTTPX client ignores the environment, so it trusts
# only public roots, never the proxy's inspection CA.
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /bin
  - /usr
  - /lib
  - /lib64
  - /etc
  - /proc
  - /dev/urandom
  - /var/log
  - /opt/embedding
  - /var/cache/huggingface
  read_write:
  - /tmp
  - /dev/null
network_policies:
  artifact_bytes:
    endpoints:
    - host: veoveo.example.com
      port: 443
      protocol: tcp
      tls: skip
    binaries:
    - path: /usr/local/bin/python3.14
