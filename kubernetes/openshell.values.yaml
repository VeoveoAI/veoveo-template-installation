# The chart comes from the maintained OpenShell revision
# ab37a698cfd03cdfb2559af7fd4263075233a48a, which merges upstream main into the
# fork and adds request-scoped provider credential refresh; the gateway, supervisor
# and sandbox runtime are built from ab37a698c. The three images are
# published to the installation's local registry as
# veoveo/openshell/{gateway,supervisor,sandbox}. The node pulls them through its
# registries.yaml entry; no image-pull Secret is used.
# The three digests come from component-lock.json's openshell-gateway,
# openshell-supervisor and openshell-sandbox, which veoveo-installer fills in; the
# chart composes each image from the registry below and its default repository
# (openshell/gateway, openshell/supervisor, openshell/sandbox), which must be that
# entry's repository, as plan checks. Render
# the identity provider's issuer and the OpenShell resource application (the
# audience), shown here with the template's example Entra identifiers, and the gateway
# name if changed.
fullnameOverride: openshell
replicaCount: 1
# The gateway Service's cluster IP, which lore.yaml's host alias names too, so that Lore
# reaches Hub's service route for repository listings: render the same address in both.
# Kubernetes keeps a Service's address, so take an unused one of K3s's Service CIDR
# (k3s.yaml) for a new gateway, or the address an existing gateway Service has.
service:
  clusterIP: REPLACE_WITH_GATEWAY_SERVICE_CLUSTER_IP
workload:
  kind: deployment
global:
  image:
    registry: registry.veoveo-system.svc.cluster.local:5000/veoveo
gateway:
  image:
    digest: "@digest:openshell-gateway@"
supervisor:
  image:
    digest: "@digest:openshell-supervisor@"
sandboxRuntime:
  image:
    digest: "@digest:openshell-sandbox@"
server:
  externalDbSecret: openshell-gateway-db
  extraVolumes:
    - name: database-ca
      configMap:
        name: postgres-client-ca
    - name: destination-ca
      configMap:
        name: platform-destination-roots-v1
        items:
          - key: ca.crt
            path: ca.crt
  extraVolumeMounts:
    - name: database-ca
      mountPath: /etc/openshell/database-ca
      readOnly: true
    - name: destination-ca
      mountPath: /etc/openshell/platform-ca
      readOnly: true
  disableTls: false
  workspaceStorageClass: local-path
  workspaceDefaultStorageSize: 10Gi
  # Match Factory/Computer seed ownership and trusted application runtimes.
  sandboxUid: 10001
  sandboxGid: 10001
  sandboxJwt:
    # Selects the default managed namespace ID; render matching PVC/Job namespaces.
    gatewayId: openshell
  drivers:
    kubernetes:
      resourceAdmission:
        # The only repositories whose digest-pinned images may be image volumes: Lore and
        # the Hub SDK CLI. Upgrading either changes its digest, never this list.
        imageRepositories:
          - registry.veoveo-system.svc.cluster.local:5000/veoveo/lore
          - registry.veoveo-system.svc.cluster.local:5000/veoveo/hub-sdk-cli
  tls:
    enableMtls: true
    certSecretName: openshell-server-tls
    clientCaSecretName: openshell-server-client-ca
    clientTlsSecretName: openshell-client-tls
pkiInitJob:
  enabled: true
  serverDnsNames:
    - openshell.openshell.svc.cluster.local
certManager:
  enabled: false
gatewayConfig:
  openshell:
    version: 2
  openshell.gateway:
    name: openshell
    compute_driver: kubernetes
  openshell.gateway.tcp_forwarding:
    active_per_sandbox: 128
    active_per_replica: 1024
    pending_per_sandbox: 128
    pending_per_replica: 512
  openshell.gateway.auth:
    allow_unauthenticated_users: false
  openshell.gateway.oidc:
    issuer: https://login.microsoftonline.com/11111111-1111-4111-8111-111111111111/v2.0
    # The aud of the OpenShell resource application's access tokens, not its .default scope.
    audience: 22222222-2222-4222-8222-222222222222
    # Entra carries app roles in roles, and app-only tokens carry their application
    # permissions there too.
    roles_claim: roles
    scopes_claim: roles
    admin_role: openshell-admin
    user_role: openshell-user
  openshell.drivers.kubernetes:
    additional_ca_bundle: /etc/openshell/platform-ca/ca.crt
    allow_driver_config: true
    workspace_mode: managed
