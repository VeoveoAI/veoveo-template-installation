# Official cloudflared 2026.10.3, pinned by its multi-arch index digest. Releases before
# 2026.10.2 trust the weak eMudhra intermediates. The rollout surges: the new pod must
# be Ready (/ready answers 200 only while connected) before the old one is removed.
# A remotely managed tunnel: its routes live in Cloudflare (tunnel-routes.yaml),
# and its token remains a trusted native Secret, read from a file, not argv/env data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-tunnel
  namespace: veoveo-system
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: public-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: public-tunnel
    spec:
      automountServiceAccountToken: false
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
          args: [tunnel, --no-autoupdate, --metrics, '0.0.0.0:2000', run, --token-file, /etc/cloudflared-credentials/token]
          ports:
            - name: metrics
              containerPort: 2000
          # Native /ready requires an active tunnel connection. Transient loss
          # changes readiness; it must not trigger a liveness restart loop.
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: credentials
              mountPath: /etc/cloudflared-credentials
              readOnly: true
            # The routes' CA pools name these files.
            - name: ca
              mountPath: /etc/cloudflared-ca
              readOnly: true
      volumes:
        - name: credentials
          secret:
            secretName: public-tunnel
            defaultMode: 0444
            # Only the token reaches the connector.
            items:
              - key: token
                path: token
        - name: ca
          configMap:
            name: public-tunnel-ca
