# Official cloudflared 2026.10.1, verified linux/amd64 manifest.
# Existing tunnel credentials remain a trusted native Secret, not argv/env data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-tunnel
  namespace: veoveo-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: public-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: public-tunnel
    spec:
      automountServiceAccountToken: false
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.1@sha256:3c0502d2da137286136b44f5b1d0d0be7030cc4833db9f53cff86beadad6cefa
          args: [tunnel, --no-autoupdate, --metrics, '0.0.0.0:2000', --config, /etc/cloudflared/config.yaml, run]
          ports:
            - name: metrics
              containerPort: 2000
          # Native /ready requires an active tunnel connection. Transient loss
          # changes readiness; it must not trigger a liveness restart loop.
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
            - name: credentials
              mountPath: /etc/cloudflared-credentials
              readOnly: true
            - name: ca
              mountPath: /etc/cloudflared-ca
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: public-tunnel
        - name: credentials
          secret:
            secretName: public-tunnel
            defaultMode: 0444
        - name: ca
          configMap:
            name: public-tunnel-ca
