# Native Lore configuration FRAGMENT for the opt-in direct_repository_roles mode.
# Native source b32265924ccf1d3c09de8f76ea4eecc8c2562b05; build matching CLI/server and Computer images.
# Replace all capitalized IDs and both synthetic repository IDs before deployment.
# Select this coherent auth profile instead of the structured/exchange profile;
# preserve the selected server's storage, TLS and hook configuration.
[server.auth]
jwt_issuer = ["https://login.microsoftonline.com/TENANT_ID/v2.0"]
jwt_audience = ["LORE_API_APPLICATION_ID"]
jwt_typ = "JWT"
resource_id_template = "urc-{id}"
baseline_access = "denied"
repository_catalog = "token_grants"

[server.auth.direct_repository_roles]
claim = "roles"

[[server.auth.direct_repository_roles.grants]]
role = "Lore.ProjectExample.Member"
repository = "0194b726b34e72b0b45550b88a967076"
permissions = []

[[server.auth.direct_repository_roles.grants]]
role = "Lore.OtherExample.Member"
repository = "0192ae48ccf17060bc1ba9d04f6acb2f"
permissions = []

[server.auth.oidc]
client_id = "LORE_PUBLIC_CLI_APPLICATION_ID"
scopes = ["openid", "api://LORE_API_APPLICATION_ID/access_as_user"]
preferred = true
# No resource_claim, permission_claim, auth_url, exchange templates or exchange issuer.
# The API access JWT must carry assigned roles and a signed root_domains value for
# the actual private Lore DNS name. Do not add that value to client configuration.
