version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /lib64, /etc, /proc, /dev/urandom, /var/log]
  # Native terminal PTYs use the multiplexer and dynamic slaves under devpts.
  read_write: [/sandbox, /tmp, /dev/null, /dev/pts]
network_policies:
  hub:
    endpoints:
      - host: veoveo.example.com
        port: 443
        path: /mcp/computer
        protocol: mcp
        enforcement: enforce
        credential_binding: {provider: computer-hub}
        mcp:
          versions: ["2026-07-28"]
          # Hub applies current user/profile/Work Context authorization to every
          # route. Native MCP framing/known-method enforcement still applies.
          allow_all_known_mcp_methods: true
    binaries:
      - path: /usr/local/bin/opencode
  model:
    endpoints:
      - host: api.deepinfra.com
        port: 443
        path: /v1/openai/chat/completions
        protocol: rest
        enforcement: enforce
        credential_binding: {provider: computer-model}
        rules:
          - allow: {method: POST, path: /v1/openai/chat/completions}
    binaries:
      - path: /usr/local/bin/opencode
  artifact_bytes:
    # Artifact's signed object URLs, under /artifacts/ on the public host. No
    # credential binding: the proxy forwards their method, Host, path, query,
    # headers and body as signed.
    endpoints:
      - host: veoveo.example.com
        port: 443
        path: /artifacts/**
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: PUT, path: /artifacts/**}
          - allow: {method: GET, path: /artifacts/**}
    binaries:
      - path: /usr/bin/curl
  lore:
    # Native host-gateway pin reaches Lore's host-loopback publication only.
    # Keep the exact port and binary; do not add an obsolete container allowed_ips.
    # Replace together with VEOVEO_LORE_REMOTE and public CA trust. Native gRPC
    # TLS and the user's own Lore grant remain end-to-end; no factory injection.
    endpoints:
      - host: host.openshell.internal
        port: 41337
        protocol: tcp
        # Lore starts TLS immediately; preserve its end-to-end gRPC handshake.
        tls: skip
    binaries:
      - path: /opt/veoveo/lore/usr/local/bin/lore
  lore_identity:
    # Native public-client OAuth through Hub's existing issuer. These REST paths
    # are disjoint from managed /mcp/computer; no transparent TCP to this authority.
    # No credential binding: Lore owns the user's login/exchange/refresh grant.
    endpoints:
      - host: veoveo.example.com
        port: 443
        path: /oauth/.well-known/openid-configuration
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /oauth/.well-known/openid-configuration}
      - host: veoveo.example.com
        port: 443
        path: /oauth/device_authorization
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: POST, path: /oauth/device_authorization}
      - host: veoveo.example.com
        port: 443
        path: /oauth/token
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: POST, path: /oauth/token}
      - host: veoveo.example.com
        port: 443
        path: /oauth/jwks.json
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /oauth/jwks.json}
    binaries:
      - path: /opt/veoveo/lore/usr/local/bin/lore
